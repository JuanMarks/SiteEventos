{% extends 'base_auth.html' %}
{% block title %}NINNA · Recuperar senha{% endblock %}

{% block auth_content %}
  <h1 class="mb-1 text-xl font-bold text-slate-800">Recuperar senha</h1>
  <p class="mb-6 text-sm text-slate-500">Informe seu e-mail e enviaremos um link de redefinição.</p>

  <form action="{% url 'recuperar_senha' %}" method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="email" class="mb-1 block text-sm font-medium text-slate-700">E-mail</label>
      <input id="email" name="email" type="email" required placeholder="seu@email.com"
             class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
    </div>
    <button type="submit"
            class="w-full rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600 focus-visible:ring-offset-2">
      Enviar link
    </button>
  </form>

  <div class="mt-6 border-t border-slate-100 pt-4 text-center text-sm">
    <a href="{% url 'login' %}" class="text-brand-600 hover:text-brand-700">Voltar ao login</a>
  </div>
{% endblock %}
