{% extends 'base_auth.html' %}
{% block title %}NINNA · Nova senha{% endblock %}

{% block auth_content %}
  <h1 class="mb-1 text-xl font-bold text-slate-800">Definir nova senha</h1>
  <p class="mb-6 text-sm text-slate-500">Escolha uma nova senha para sua conta.</p>

  <form action="" method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="senha" class="mb-1 block text-sm font-medium text-slate-700">Nova senha</label>
      <input id="senha" name="senha" type="password" autocomplete="new-password" required
             class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
    </div>
    <div>
      <label for="verifica_senha" class="mb-1 block text-sm font-medium text-slate-700">Repita a nova senha</label>
      <input id="verifica_senha" name="verifica_senha" type="password" autocomplete="new-password" required
             class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
    </div>
    <button type="submit"
            class="w-full rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600 focus-visible:ring-offset-2">
      Salvar nova senha
    </button>
  </form>
{% endblock %}
