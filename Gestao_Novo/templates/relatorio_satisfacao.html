{% extends 'base_auth.html' %}
{% block title %}NINNA · Avaliação do evento{% endblock %}

{% block auth_content %}
  <h1 class="mb-1 text-xl font-bold text-slate-800">Formulário de avaliação</h1>
  <p class="mb-6 text-sm text-slate-500">Conte o que você achou do evento.</p>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="nota" class="mb-1 block text-sm font-medium text-slate-700">Sua nota</label>
      <select id="nota" name="nota" required
              class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
        <option value="">Selecione uma opção</option>
        <option value="10">10 · Excelente</option>
        <option value="9">9 · Ótimo</option>
        <option value="8">8 · Bom</option>
        <option value="7">7 · Mediano</option>
        <option value="6">6 · Ruim</option>
        <option value="5">5 · Péssimo</option>
      </select>
    </div>
    <div>
      <label for="opiniao" class="mb-1 block text-sm font-medium text-slate-700">Sua opinião</label>
      <textarea id="opiniao" name="opiniao" rows="5" maxlength="100" placeholder="Digite aqui" required
                class="w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600"></textarea>
    </div>
    <button type="submit"
            class="w-full rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-600 focus-visible:ring-offset-2">
      Enviar avaliação
    </button>
  </form>
{% endblock %}
