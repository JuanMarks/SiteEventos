{% extends 'base.html' %}
{% load static %}

{% block title %}NINNA · Criar evento{% endblock %}
{% block header_title %}Criar evento{% endblock %}

{% block content %}
  <div class="mx-auto max-w-2xl">
    {% include 'messages/alertas.html' %}

    <form action="{% url 'cadastrar_eventos' %}" method="post" enctype="multipart/form-data"
          class="space-y-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
      {% csrf_token %}

      <div>
        <h3 class="mb-4 text-sm font-semibold uppercase tracking-wide text-slate-400">Empresa</h3>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label for="grupo" class="mb-1 block text-sm font-medium text-slate-700">Grupo</label>
            <select name="grupo" id="grupo" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
              <option value="STARTUP">Startup</option>
              <option value="MANTENEDOR">Mantenedor</option>
              <option value="OUTRA EMPRESA">Outra empresa</option>
            </select>
          </div>
          <div>
            <label for="nome_empresa" class="mb-1 block text-sm font-medium text-slate-700">Nome da empresa</label>
            <input type="text" name="nome_empresa" id="nome_empresa" required placeholder="Empresa"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
          </div>
        </div>
      </div>

      <div>
        <h3 class="mb-4 text-sm font-semibold uppercase tracking-wide text-slate-400">Evento</h3>
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label for="data_inicio" class="mb-1 block text-sm font-medium text-slate-700">Início</label>
            <input type="datetime-local" name="data_inicio" id="data_inicio" required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
          </div>
          <div>
            <label for="data_termino" class="mb-1 block text-sm font-medium text-slate-700">Término</label>
            <input type="datetime-local" name="data_termino" id="data_termino" required
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
          </div>
          <div>
            <label for="nome_evento" class="mb-1 block text-sm font-medium text-slate-700">Nome do evento</label>
            <input type="text" name="nome_evento" id="nome_evento" required placeholder="Nome do evento"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
          </div>
          <div>
            <label for="qtd_pessoas" class="mb-1 block text-sm font-medium text-slate-700">Convidados previstos</label>
            <input type="number" name="qtd_pessoas" id="qtd_pessoas" min="1" required placeholder="Ex.: 50"
                   class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
          </div>
          <div class="sm:col-span-2">
            <label for="publico" class="mb-1 block text-sm font-medium text-slate-700">Público</label>
            <select name="publico" id="publico" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600">
              <option value="Aberto">Aberto</option>
              <option value="Privado">Privado</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <label for="descricao" class="mb-1 block text-sm font-medium text-slate-700">Descrição</label>
            <textarea name="descricao" id="descricao" rows="5" required
                      class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-brand-600 focus:outline-none focus:ring-1 focus:ring-brand-600"></textarea>
          </div>
        </div>
      </div>

      <div>
        <h3 class="mb-4 text-sm font-semibold uppercase tracking-wide text-slate-400">Mídia</h3>
        <label for="foto_evento" class="mb-1 block text-sm font-medium text-slate-700">Imagem do evento</label>
        <input type="file" name="foto_evento" id="foto_evento" accept="image/*" required
               class="block w-full text-sm text-slate-500 file:mr-4 file:rounded-lg file:border-0 file:bg-brand-50 file:px-4 file:py-2 file:text-sm file:font-medium file:text-brand-700 hover:file:bg-brand-100">
      </div>

      <div class="flex justify-end gap-3 border-t border-slate-100 pt-6">
        <a href="{% url 'index' %}" class="rounded-lg bg-slate-100 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-200">Cancelar</a>
        <button type="submit" class="rounded-lg bg-brand-600 px-5 py-2 text-sm font-medium text-white hover:bg-brand-700">Cadastrar evento</button>
      </div>
    </form>
  </div>
{% endblock %}
